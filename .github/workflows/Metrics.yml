name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICSTOKEN }}
          user: Maede-mim
          config_timezone: Europe/Minsk
          template: classic
          output: ./assets/github-metrics.svg
          committer_message: "chore: update metrics"
          committer_name: "Maede Mohammadi"
          committer_email: "maaaede.mim@gmail.com"
          base: header, activity, community, repositories, metadata
          plugin_introduction: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_achievements: yes
          plugin_achievements_threshold: 0
          plugin_achievements_display: detailed
          plugin_calendar: yes
          plugin_calendar_limit: 11
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_licenses: yes
          plugin_licenses_setup: npm ci
          plugin_skyline: yes
          plugin_skyline_year: 2025
          plugin_skyline_frames: 120
          plugin_skyline_quality: 1
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist
          plugin_support: yes
          plugin_topics: yes
          plugin_topics_limit: 10
          plugin_topics_mode: icons
